name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          # Runner images ship Microsoft/Google apt lists. If one of those
          # mirrors errors, apt-get update exits 100 and the deb is never built.
          shopt -s nullglob
          for f in /etc/apt/sources.list.d/*; do
            if ! grep -q 'ubuntu.com' "$f"; then
              echo "dropping $f"
              sudo rm -f "$f"
            fi
          done
          sudo apt-get update
          # libstdc++-dev is only a virtual name here and apt will not pick a provider.
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-13-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release bundle
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Package deb
        run: scripts/package-deb.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jterm-deb
          path: |
            packaging/out/*.deb
            packaging/out/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/out/*.deb
            packaging/out/*.sha256
          generate_release_notes: true
